<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS VN Captions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #40E0D0;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 4px;
    }
    .vn-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 950px;
      background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0;
      border-radius: 10px;
      padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35);
      color: #ffffff;
      opacity: 1; /* Keep visible for testing */
      transition: opacity 0.4s ease;
    }
    .speaker-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #40E0D0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .dialogue-text {
      font-size: 1.45rem;
      line-height: 1.55;
      min-height: 2.8em;
    }
  </style>
</head>
<body>
  <div id="status">Status: Initializing...</div>

  <div class="vn-container" id="box">
    <div class="speaker-name">Streamer</div>
    <div class="dialogue-text"><span id="text">Waiting for speech...</span></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const textEl = document.getElementById('text');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusEl.textContent = "Error: Speech Recognition API not supported in this browser.";
      statusEl.style.color = "#ff4444";
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        statusEl.textContent = "Status: Listening... Speak into your mic!";
        statusEl.style.color = "#00ff88";
      };

      recognition.onerror = (e) => {
        statusEl.textContent = "Error: " + e.error;
        statusEl.style.color = "#ff4444";
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        textEl.textContent = transcript;
      };

      recognition.onend = () => recognition.start();
      recognition.start();
    }
  </script>
</body>
</html>
