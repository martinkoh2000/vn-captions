<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Universal VN Captions</title>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    .vn-container {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 82%; max-width: 950px; background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0; border-radius: 10px; padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35); color: #ffffff; opacity: 0;
      transition: opacity 0.4s ease;
    }
    .speaker-name { font-size: 1.25rem; font-weight: 800; color: #40E0D0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    .dialogue-text { font-size: 1.45rem; line-height: 1.55; min-height: 2.8em; }
    .cursor { display: inline-block; width: 10px; height: 1.25em; background-color: #40E0D0; margin-left: 5px; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <!-- Load HuggingFace Transformers.js for browser-native Whisper AI -->
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    let silenceTimer = null;
    let recognizer;

    async function init() {
      textEl.textContent = "Loading AI Speech Engine (First load takes ~10s)...";
      boxEl.style.opacity = '1';

      // Load lightweight quantized Whisper directly inside browser WASM
      recognizer = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
      
      textEl.textContent = "";
      boxEl.style.opacity = '0';
      startListening();
    }

    async function startListening() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioContext = new AudioContext({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(stream);
      const processor = audioContext.createScriptProcessor(4096, 1, 1);

      let audioChunks = [];

      processor.onaudioprocess = async (e) => {
        const inputData = e.inputBuffer.getChannelData(0);
        audioChunks.push(...inputData);

        // Process audio in 3-second slices
        if (audioChunks.length >= 16000 * 3) {
          const bufferToProcess = new Float32Array(audioChunks);
          audioChunks = [];

          const output = await recognizer(bufferToProcess);
          if (output.text.strip()) {
            displayDialogue(output.text.trim());
          }
        }
      };

      source.connect(processor);
      processor.connect(audioContext.destination);
    }

    function displayDialogue(text) {
      boxEl.style.opacity = '1';
      textEl.textContent = text;
      
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, 5000); // 5-second buffer
    }

    init();
  </script>
</head>
<body>
  <div class="vn-container" id="box">
    <div class="speaker-name">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>
</body>
</html>
