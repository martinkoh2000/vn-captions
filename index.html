<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS VN Captions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Mic Configuration Bar (Visible inside OBS Interact Window) */
    .controls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 28, 0.95);
      border: 1px solid #40E0D0;
      padding: 8px 15px;
      border-radius: 6px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controls label {
      color: #40E0D0;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .controls select {
      background: #0f1923;
      color: #fff;
      border: 1px solid #40E0D0;
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }
    /* Visual VU Meter */
    .meter-box {
      width: 100px;
      height: 10px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #555;
    }
    .meter-fill {
      width: 0%;
      height: 100%;
      background: #00FFcc;
      transition: width 0.05s ease;
    }

    .vn-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 950px;
      background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0;
      border-radius: 10px;
      padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35), inset 0 0 15px rgba(64, 224, 208, 0.1);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .speaker-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #40E0D0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(64, 224, 208, 0.6);
      display: flex;
      align-items: center;
    }
    .speaker-name::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(64,224,208,0.6), transparent);
      margin-left: 15px;
    }
    .dialogue-text {
      font-size: 1.45rem;
      line-height: 1.55;
      min-height: 2.8em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.25em;
      background-color: #40E0D0;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      box-shadow: 0 0 8px #40E0D0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Controls overlay -->
  <div class="controls">
    <label for="micSelect">Mic:</label>
    <select id="micSelect"><option>Detecting Mics...</option></select>
    <div class="meter-box"><div class="meter-fill" id="vuMeter"></div></div>
  </div>

  <div class="vn-container" id="box">
    <div class="speaker-name" id="speaker-label">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>

  <script>
    const micSelect = document.getElementById('micSelect');
    const vuMeter = document.getElementById('vuMeter');
    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    
    let targetText = '';
    let currentText = '';
    let finalTranscript = '';
    let silenceTimer = null;
    let recognition = null;
    let audioContext = null;
    let micStream = null;

    // Typewriter engine loop
    function typeLoop() {
      if (currentText.length < targetText.length) {
        currentText += targetText.charAt(currentText.length);
        textEl.textContent = currentText;
      }
      setTimeout(typeLoop, 18);
    }
    typeLoop();

    function resetSilenceTimer() {
      boxEl.style.opacity = '1';
      clearTimeout(silenceTimer);
      
      silenceTimer = setTimeout(() => {
        finalTranscript = '';
        targetText = '';
        currentText = '';
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, 5000);
    }

    // Initialize microphone hardware enumeration and VU Meter
    async function initAudioDevice(deviceId = null) {
      try {
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
        }

        const constraints = deviceId ? { audio: { deviceId: { exact: deviceId } } } : { audio: true };
        micStream = await navigator.mediaDevices.getUserMedia(constraints);

        // Build VU Meter visual feedback
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(micStream);
        source.connect(analyser);
        analyser.fftSize = 64;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function drawVU() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          vuMeter.style.width = Math.min(100, average * 2) + '%';
          requestAnimationFrame(drawVU);
        }
        drawVU();

        // Populate dropdown menu options
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        
        micSelect.innerHTML = '';
        audioInputs.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.text = device.label || `Microphone ${index + 1}`;
          if (deviceId && device.deviceId === deviceId) opt.selected = true;
          micSelect.appendChild(opt);
        });

      } catch (err) {
        micSelect.innerHTML = '<option>Mic Access Error</option>';
      }
    }

    // Handle Dropdown Selection Changes
    micSelect.addEventListener('change', () => {
      initAudioDevice(micSelect.value);
      if (recognition) {
        recognition.stop(); // Restart engine to pick up new channel stream
      }
    });

    // Web Speech API Receiver
    function startSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        textEl.textContent = "Speech recognition engine unavailable in this browser engine.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        resetSilenceTimer();
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        targetText = finalTranscript + interimTranscript;
        
        if (targetText.length > 220) {
          finalTranscript = targetText.slice(-160);
          currentText = '';
        }
      };

      recognition.onend = () => recognition.start();
      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') setTimeout(() => recognition.start(), 400);
      };

      recognition.start();
    }

    initAudioDevice().then(startSpeechEngine);
  </script>
</body>
</html>
