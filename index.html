<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS VN Captions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Mic Selector Bar (Shown in OBS Interact Mode) */
    .controls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 28, 0.95);
      border: 1px solid #40E0D0;
      padding: 8px 15px;
      border-radius: 6px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls label {
      color: #40E0D0;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .controls select {
      background: #0f1923;
      color: #fff;
      border: 1px solid #40E0D0;
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }

    .vn-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 950px;
      background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0;
      border-radius: 10px;
      padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35), inset 0 0 15px rgba(64, 224, 208, 0.1);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .speaker-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #40E0D0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(64, 224, 208, 0.6);
      display: flex;
      align-items: center;
    }
    .speaker-name::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(64,224,208,0.6), transparent);
      margin-left: 15px;
    }
    .dialogue-text {
      font-size: 1.45rem;
      line-height: 1.55;
      min-height: 2.8em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.25em;
      background-color: #40E0D0;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      box-shadow: 0 0 8px #40E0D0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Controls Dropdown -->
  <div class="controls" id="mic-controls">
    <label for="micSelect">Microphone:</label>
    <select id="micSelect"><option>Requesting Mic Access...</option></select>
  </div>

  <div class="vn-container" id="box">
    <div class="speaker-name" id="speaker-label">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>

  <script>
    const micSelect = document.getElementById('micSelect');
    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    
    let targetText = '';
    let currentText = '';
    let finalTranscript = '';
    let typingSpeed = 18;
    let silenceTimer = null;
    let recognition = null;
    let currentStream = null;
    const SILENCE_TIMEOUT = 5000;

    // Typewriter loop
    function typeLoop() {
      if (currentText.length < targetText.length) {
        currentText += targetText.charAt(currentText.length);
        textEl.textContent = currentText;
      }
      setTimeout(typeLoop, typingSpeed);
    }
    typeLoop();

    function resetSilenceTimer() {
      boxEl.style.opacity = '1';
      clearTimeout(silenceTimer);
      
      silenceTimer = setTimeout(() => {
        finalTranscript = '';
        targetText = '';
        currentText = '';
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, SILENCE_TIMEOUT);
    }

    // Populate Microphone List
    async function getMicrophones() {
      try {
        // Request initial permission to expose device labels
        currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === 'audioinput');
        
        micSelect.innerHTML = '';
        audioInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Microphone ${index + 1}`;
          micSelect.appendChild(option);
        });

        startSpeechRecognition();
      } catch (err) {
        micSelect.innerHTML = '<option>Mic Access Denied</option>';
        textEl.textContent = "Please right-click Browser Source -> Interact, then allow Mic Access.";
      }
    }

    // Handle Mic Switch
    micSelect.addEventListener('change', async () => {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const deviceId = micSelect.value;
      currentStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { deviceId: { exact: deviceId } } 
      });
      if (recognition) {
        recognition.stop();
      }
    });

    // Start Speech Recognition Engine
    function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        textEl.textContent = "Speech recognition is not supported in this browser version.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        resetSilenceTimer();
        
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        targetText = finalTranscript + interimTranscript;
        
        if (targetText.length > 220) {
          finalTranscript = targetText.slice(-160);
          currentText = '';
        }
      };

      recognition.onend = () => {
        recognition.start();
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          setTimeout(() => recognition.start(), 400);
        }
      };

      recognition.start();
    }

    getMicrophones();
  </script>
</body>
</html>
