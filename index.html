<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Universal VN Captions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .vn-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 950px;
      background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0;
      border-radius: 10px;
      padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35), inset 0 0 15px rgba(64, 224, 208, 0.1);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .speaker-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #40E0D0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(64, 224, 208, 0.6);
      display: flex;
      align-items: center;
    }
    .speaker-name::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(64,224,208,0.6), transparent);
      margin-left: 15px;
    }
    .dialogue-text {
      font-size: 1.45rem;
      line-height: 1.55;
      min-height: 2.8em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.25em;
      background-color: #40E0D0;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      box-shadow: 0 0 8px #40E0D0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    // Allow WebAssembly execution inside browser workers
    env.allowLocalModels = false;

    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    
    let recognizer;
    let targetText = '';
    let currentText = '';
    let silenceTimer = null;
    let isProcessing = false;
    let audioBuffer = [];
    
    const SILENCE_TIMEOUT = 5000;
    const TYPING_SPEED = 18; // Milliseconds per character

    // Smooth Typewriter Animation Engine
    function typeLoop() {
      if (currentText.length < targetText.length) {
        currentText += targetText.charAt(currentText.length);
        textEl.textContent = currentText;
      }
      setTimeout(typeLoop, TYPING_SPEED);
    }
    typeLoop();

    async function init() {
      boxEl.style.opacity = '1';
      textEl.textContent = "Loading WebAssembly Speech Model...";

      try {
        recognizer = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
        textEl.textContent = "";
        boxEl.style.opacity = '0';
        await startListening();
      } catch (err) {
        textEl.textContent = "Engine Load Error: " + err.message;
      }
    }

    async function startListening() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        
        // Dynamic Worklet fallback for cross-browser audio capture
        const blob = new Blob([`
          class AudioProcessor extends AudioWorkletProcessor {
            process(inputs) {
              const input = inputs[0];
              if (input && input[0]) {
                this.port.postMessage(input[0]);
              }
              return true;
            }
          }
          registerProcessor('audio-processor', AudioProcessor);
        `], { type: 'application/javascript' });

        const workletUrl = URL.createObjectURL(blob);
        await audioContext.audioWorklet.addModule(workletUrl);

        const source = audioContext.createMediaStreamSource(stream);
        const workletNode = new AudioWorkletNode(audioContext, 'audio-processor');

        workletNode.port.onmessage = (e) => {
          audioBuffer.push(...e.data);
          processAudioQueue();
        };

        source.connect(workletNode);
        workletNode.connect(audioContext.destination);
      } catch (err) {
        boxEl.style.opacity = '1';
        textEl.textContent = "Mic Permission Required: Right-click source -> Interact and allow mic access.";
      }
    }

    async function processAudioQueue() {
      // Process when buffer hits ~2 seconds of audio data (32,000 samples @ 16kHz)
      if (audioBuffer.length < 32000 || isProcessing) return;

      const chunkToProcess = new Float32Array(audioBuffer);
      audioBuffer = []; // Clear current buffer for continuous streaming

      // Peak volume gate check
      let maxVol = 0;
      for (let i = 0; i < chunkToProcess.length; i++) {
        const amp = Math.abs(chunkToProcess[i]);
        if (amp > maxVol) maxVol = amp;
      }

      // Ignore low ambient room noise
      if (maxVol < 0.015) return;

      isProcessing = true;
      try {
        const output = await recognizer(chunkToProcess, {
          chunk_length_s: 30,
          stride_length_s: 3
        });

        let text = "";
        if (typeof output === 'string') {
          text = output;
        } else if (output && output.text) {
          text = output.text;
        }

        text = text.trim();

        // Sanitize noise artifacts
        if (text && !text.includes("[BLANK_AUDIO]") && text.length > 1) {
          appendDialogue(text);
        }
      } catch (err) {
        console.error("Inference Error:", err);
      } finally {
        isProcessing = false;
      }
    }

    function appendDialogue(newPhrase) {
      boxEl.style.opacity = '1';
      
      // Accumulate text or append with space
      if (!targetText) {
        targetText = newPhrase;
      } else {
        targetText += " " + newPhrase;
      }

      // Limit dialogue container scroll length
      if (targetText.length > 200) {
        targetText = targetText.slice(-140);
        currentText = '';
      }

      // Reset fade-out timer on speech input
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        targetText = '';
        currentText = '';
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, SILENCE_TIMEOUT);
    }

    window.addEventListener('load', init);
  </script>
</head>
<body>
  <div class="vn-container" id="box">
    <div class="speaker-name">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>
</body>
</html>
