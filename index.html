<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Universal VN Captions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .vn-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 950px;
      background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0;
      border-radius: 10px;
      padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35), inset 0 0 15px rgba(64, 224, 208, 0.1);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .speaker-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #40E0D0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(64, 224, 208, 0.6);
      display: flex;
      align-items: center;
    }
    .speaker-name::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(64,224,208,0.6), transparent);
      margin-left: 15px;
    }
    .dialogue-text {
      font-size: 1.45rem;
      line-height: 1.55;
      min-height: 2.8em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.25em;
      background-color: #40E0D0;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      box-shadow: 0 0 8px #40E0D0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    env.allowLocalModels = false;

    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    
    let recognizer;
    let targetText = '';
    let currentText = '';
    let silenceTimer = null;
    let isProcessing = false;
    let audioBuffer = [];
    let audioContext;
    
    const SILENCE_TIMEOUT = 5000;
    const TYPING_SPEED = 18;

    // Typewriter engine loop
    function typeLoop() {
      if (currentText.length < targetText.length) {
        currentText += targetText.charAt(currentText.length);
        textEl.textContent = currentText;
      }
      setTimeout(typeLoop, TYPING_SPEED);
    }
    typeLoop();

    async function initEngine() {
      boxEl.style.opacity = '1';
      textEl.textContent = "Click anywhere inside OBS Interact mode to enable microphone audio...";

      // AudioContext unlock on click/interaction
      const unlockAudio = async () => {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        
        textEl.textContent = "Loading AI Speech Model (Transformers.js)...";
        window.removeEventListener('click', unlockAudio);
        loadModel();
      };

      window.addEventListener('click', unlockAudio);
    }

    async function loadModel() {
      try {
        recognizer = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
        textEl.textContent = "AI Ready! Speak into your microphone.";
        
        setTimeout(() => {
          textEl.textContent = "";
          boxEl.style.opacity = '0';
        }, 2000);

        await startAudioStream();
      } catch (err) {
        textEl.textContent = "Engine Error: " + err.message;
      }
    }

    async function startAudioStream() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioContext.createMediaStreamSource(stream);
        
        // Robust ScriptProcessor fallback to bypass strict worker policies
        const processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) => {
          const inputData = e.inputBuffer.getChannelData(0);
          audioBuffer.push(...inputData);
          
          // Check audio buffer roughly every 2 seconds (32000 samples)
          if (audioBuffer.length >= 32000) {
            processAudioChunk();
          }
        };

        source.connect(processor);
        processor.connect(audioContext.destination);
      } catch (err) {
        boxEl.style.opacity = '1';
        textEl.textContent = "Mic Permission Denied: Right-click source -> Interact -> Allow Mic";
      }
    }

    async function processAudioChunk() {
      if (isProcessing || audioBuffer.length < 32000) return;

      const samples = new Float32Array(audioBuffer);
      audioBuffer = []; // Reset queue for smooth stream

      // Volume threshold gate
      let maxVol = 0;
      for (let i = 0; i < samples.length; i++) {
        const vol = Math.abs(samples[i]);
        if (vol > maxVol) maxVol = vol;
      }

      // Skip quiet background noise
      if (maxVol < 0.012) return;

      isProcessing = true;
      try {
        const output = await recognizer(samples);
        let text = "";

        if (typeof output === 'string') {
          text = output;
        } else if (output && output.text) {
          text = output.text;
        }

        text = text.trim();

        if (text && !text.includes("[BLANK_AUDIO]") && text.length > 1) {
          displayDialogue(text);
        }
      } catch (err) {
        console.error("Transcription error:", err);
      } finally {
        isProcessing = false;
      }
    }

    function displayDialogue(newPhrase) {
      boxEl.style.opacity = '1';
      
      if (!targetText) {
        targetText = newPhrase;
      } else {
        targetText += " " + newPhrase;
      }

      if (targetText.length > 200) {
        targetText = targetText.slice(-140);
        currentText = '';
      }

      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        targetText = '';
        currentText = '';
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, SILENCE_TIMEOUT);
    }

    window.addEventListener('load', initEngine);
  </script>
</head>
<body>
  <div class="vn-container" id="box">
    <div class="speaker-name">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>
</body>
</html>
