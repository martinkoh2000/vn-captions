<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS VN AI Captions</title>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    
    /* OBS Interactive Setup Overlay */
    #setup-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 20, 28, 0.95); border: 2px solid #40E0D0;
      border-radius: 8px; padding: 15px 25px; color: #fff; text-align: center;
      z-index: 9999; box-shadow: 0 0 15px rgba(64, 224, 208, 0.4);
    }
    .btn {
      background: #40E0D0; color: #0a141c; border: none; padding: 8px 16px;
      font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px;
    }
    #meter-bar {
      width: 100%; height: 6px; background: #222; margin-top: 10px; border-radius: 3px; overflow: hidden;
    }
    #meter-fill { width: 0%; height: 100%; background: #40E0D0; transition: width 0.1s ease; }

    /* Visual Novel Box Styling */
    .vn-container {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 82%; max-width: 950px; background: rgba(10, 20, 28, 0.92);
      border: 2px solid #40E0D0; border-radius: 10px; padding: 22px 28px;
      box-shadow: 0 0 20px rgba(64, 224, 208, 0.35); color: #ffffff; opacity: 0;
      transition: opacity 0.4s ease;
    }
    .speaker-name { font-size: 1.25rem; font-weight: 800; color: #40E0D0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    .dialogue-text { font-size: 1.45rem; line-height: 1.55; min-height: 2.8em; }
    .cursor { display: inline-block; width: 10px; height: 1.25em; background-color: #40E0D0; margin-left: 5px; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    const textEl = document.getElementById('text');
    const boxEl = document.getElementById('box');
    const setupPanel = document.getElementById('setup-panel');
    const statusText = document.getElementById('status');
    const meterFill = document.getElementById('meter-fill');
    const startBtn = document.getElementById('start-btn');

    let silenceTimer = null;
    let recognizer;
    let audioContext;

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      statusText.textContent = "Loading AI Speech Engine (~10s on first run)...";
      
      try {
        // Initialize WebAssembly AI model
        recognizer = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
        statusText.textContent = "Requesting Microphone Access...";
        
        // Request Mic & Bypass Autoplay policy
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        
        const source = audioContext.createMediaStreamSource(stream);
        const processor = audioContext.createScriptProcessor(4096, 1, 1);

        // Audio Meter Visualizer
        const analyser = audioContext.createAnalyser();
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        function updateMeter() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          meterFill.style.width = Math.min(100, average * 2) + '%';
          requestAnimationFrame(updateMeter);
        }
        updateMeter();

        // Speech Buffer Processing
        let audioChunks = [];
        processor.onaudioprocess = async (e) => {
          const inputData = e.inputBuffer.getChannelData(0);
          audioChunks.push(...inputData);

          // Every ~3 seconds of audio, process model
          if (audioChunks.length >= 16000 * 3) {
            const bufferToProcess = new Float32Array(audioChunks);
            audioChunks = [];

            const output = await recognizer(bufferToProcess);
            if (output.text && output.text.trim()) {
              displayDialogue(output.text.trim());
            }
          }
        };

        source.connect(processor);
        processor.connect(audioContext.destination);

        statusText.textContent = "Engine Ready! Hide setup panel by clicking complete.";
        setupPanel.style.display = 'none'; // Hide setup box once running
      } catch (err) {
        statusText.textContent = "Error: " + err.message;
        startBtn.disabled = false;
      }
    };

    function displayDialogue(text) {
      boxEl.style.opacity = '1';
      textEl.textContent = text;
      
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        textEl.textContent = '';
        boxEl.style.opacity = '0';
      }, 5000);
    }
  </script>
</head>
<body>

  <!-- OBS Interaction Setup Panel -->
  <div id="setup-panel">
    <div id="status">Click "Enable Mic Engine" to authorize overlay</div>
    <div id="meter-bar"><div id="meter-fill"></div></div>
    <button class="btn" id="start-btn">Enable Mic Engine</button>
  </div>

  <div class="vn-container" id="box">
    <div class="speaker-name">Streamer</div>
    <div class="dialogue-text"><span id="text"></span><span class="cursor"></span></div>
  </div>

</body>
</html>
